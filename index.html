<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1118" media="(prefers-color-scheme: dark)">
<meta name="description" content="DebateBase – persönliche Wissensdatenbank für Diskussionen auf X. Alle Daten bleiben auf dem Gerät.">
<title>DebateBase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top"><div><h1 id="title">DebateBase</h1><p><span id="sub"></span><span id="saved"></span></p></div>
    <button class="icon-btn" id="themeBtn" data-act="toggle-theme" aria-label="Hell- oder Dunkelmodus wechseln"></button></header>
  <main id="view"><p class="note">DebateBase wird geladen …</p></main>
</div>
<nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">DebateBase benötigt JavaScript. Bitte JavaScript im Browser aktivieren.</p></noscript>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
